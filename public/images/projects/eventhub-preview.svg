<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="auto">
  <defs>
    <linearGradient id="eh-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <pattern id="eh-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#eh-bg)"/>
  <rect width="1200" height="675" fill="url(#eh-grid)"/>

  <g transform="translate(100, 75)">
    <rect width="1000" height="525" rx="14" fill="#0f1422" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>
    <rect width="1000" height="44" rx="14" fill="#141c2e"/>
    <circle cx="28" cy="22" r="6" fill="#ef4444" opacity="0.8"/>
    <circle cx="48" cy="22" r="6" fill="#f59e0b" opacity="0.8"/>
    <circle cx="68" cy="22" r="6" fill="#10b981" opacity="0.8"/>
    <rect x="180" y="10" width="640" height="24" rx="6" fill="rgba(255, 255, 255, 0.05)"/>
    <text x="500" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">eventhub-cc • campus event telemetry engine</text>

    <!-- Header inside -->
    <rect x="30" y="70" width="940" height="70" rx="8" fill="#172136" stroke="rgba(255,255,255,0.06)"/>
    <text x="55" y="112" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff">EventHub-CC</text>
    <text x="215" y="112" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#a855f7">CAMPUS EVENT TELEMETRY</text>

    <!-- Telemetry Cards -->
    <g transform="translate(30, 165)">
      <!-- Left: Ingestion Feed -->
      <rect width="580" height="330" rx="8" fill="#131b2e" stroke="rgba(255,255,255,0.06)"/>
      <text x="24" y="38" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Automated Ingestion Feed (Cheerio Pipeline)</text>
      <line x1="24" y1="55" x2="556" y2="55" stroke="rgba(255,255,255,0.08)"/>

      <g transform="translate(24, 75)">
        <rect width="532" height="60" rx="6" fill="#182238"/>
        <text x="18" y="26" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Annual Campus Hackathon 2026</text>
        <text x="18" y="46" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00f5d4">STATUS: INGESTED &amp; NORMALIZED • 480 Registrations</text>
      </g>

      <g transform="translate(24, 150)">
        <rect width="532" height="60" rx="6" fill="#182238"/>
        <text x="18" y="26" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#ffffff">AI &amp; Robotics Research Symposium</text>
        <text x="18" y="46" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">STATUS: REVIEW WORKBENCH APPROVED • Hall A</text>
      </g>

      <g transform="translate(24, 225)">
        <rect width="532" height="60" rx="6" fill="#182238"/>
        <text x="18" y="26" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Open Source Developers Meetup</text>
        <text x="18" y="46" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a855f7">STATUS: TELEMETRY ACTIVE • 150 Spots</text>
      </g>
    </g>

    <!-- Right: Telemetry Overview -->
    <g transform="translate(635, 165)">
      <rect width="335" height="330" rx="8" fill="#131b2e" stroke="rgba(255,255,255,0.06)"/>
      <text x="24" y="38" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Obsidian Lumina Layout</text>
      <line x1="24" y1="55" x2="311" y2="55" stroke="rgba(255,255,255,0.08)"/>
      <text x="24" y="90" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Active Data Streams</text>
      <text x="24" y="118" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" fill="#00f5d4">Next.js 15 App</text>
      <text x="24" y="160" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Runtime</text>
      <text x="24" y="188" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" fill="#38bdf8">Node.js 22</text>
      <text x="24" y="230" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">UI Animations</text>
      <text x="24" y="258" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" fill="#a855f7">Framer Motion</text>
    </g>
